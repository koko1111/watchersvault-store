manifestVersion: 1
id: watchersvault-livesync
storage:
  dataRoot: data
name: LiveSync
tagline: CouchDB for the Obsidian LiveSync plugin
icon: https://raw.githubusercontent.com/koko1111/watchersvault-store/master/watchersvault-livesync/icon.svg
category: files
version: "1.0.53"
port: 25984
description: >-
  CouchDB for the Self-hosted LiveSync Obsidian plugin. The first database
  is named test, for the vault at documents/obsidian/test. Obsidian uploads
  that vault. This server does not read the notes itself.


  CouchDB is on this app's Umbrel port. Devices that are already on the
  Umbrel Tailscale network open it over HTTP. There is no extra Tailscale
  node and no Caddy certificate. The password is the one Umbrel shows for
  this app. The username is livesync.


  In the test vault, install Self-hosted LiveSync. On Connection Method,
  choose Configure a remote manually. Use CouchDB. From a tailnet device
  the URI is http://<this-umbrel-tailscale-ip>:25984. From the local
  network, use this Umbrel address and the same port. The database name
  is test. Turn on end-to-end encryption and keep the passphrase. It is
  not stored here. Leave Obsidian Sync off for that vault.


  A phone may reject HTTP to a .ts.net name. Use the tailnet IP. Desktop
  can use either address.


  When the test vault is syncing, add one lowercase database name for each
  other vault to COUCHDB_DATABASES in the app data .env file and restart.
  Each vault uses its own database.
developer: vrtmrz
website: https://github.com/vrtmrz/obsidian-livesync
submitter: Watchers
submission: https://github.com/vrtmrz/obsidian-livesync
repo: https://github.com/vrtmrz/obsidian-livesync
support: https://github.com/vrtmrz/obsidian-livesync/issues
gallery:
  - https://raw.githubusercontent.com/koko1111/watchersvault-store/master/watchersvault-livesync/icon.svg
releaseNotes: >-
  The installer no longer fails while Umbrel rewrites the compose file.
  CouchDB is still served on the Umbrel port over the existing Tailscale
  connection.
dependencies: []
path: ""
defaultUsername: livesync
defaultPassword: ""
deterministicPassword: true
