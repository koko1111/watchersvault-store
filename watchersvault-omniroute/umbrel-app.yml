manifestVersion: 1
id: watchersvault-omniroute
name: OmniRoute
tagline: One endpoint for hundreds of AI models
icon: https://raw.githubusercontent.com/koko1111/watchersvault-store/master/watchersvault-omniroute/icon.svg
category: ai
version: "3.8.56"
port: 20128
description: >-
  OmniRoute is an OpenAI-compatible gateway for a large set of model
  providers. Open the dashboard from Umbrel, create an API key, and point
  Cursor or another client at this app's /v1 path. Calls to /v1 require that
  key. The dashboard itself stays behind Umbrel login.


  The first launch asks you to choose a dashboard password. Signing secrets
  are created on that launch and stored in the app data directory.


  The Node heap is 4096 MB, which is enough for one coding client. Change
  OMNIROUTE_MEMORY_MB in the app settings for a heavier agent, or lower it
  on a small Umbrel. The live websocket on port 20132 is not exposed.


  Tailscale HTTPS is optional. Leave the public address and auth key blank to
  keep using the Umbrel address. It does not open ports 80 or 443 on the
  Umbrel, and it does not replace the Umbrel Tailscale app. The tailnet
  address uses OmniRoute's own password and API key.


  To turn Tailscale HTTPS on:

  1. In the Tailscale admin console, enable HTTPS certificates and MagicDNS.

  2. Create a reusable auth key.

  3. Update this app, then set NEXT_PUBLIC_BASE_URL to
  https://omniroute.your-tailnet.ts.net and AUTH_COOKIE_SECURE to true.
  Leave TS_HOSTNAME as omniroute unless you want another name. Put the auth
  key in the .env file in this app's data folder, beside settings.yml:
  TS_AUTHKEY=tskey-auth-... That file is mode 600 and is not an Umbrel
  setting. A key already saved in settings is moved there on update.

  4. Restart the app. That joins a separate tailnet node and serves it with
  Caddy. Tailnet peers can open that https address directly.
developer: cheaper-inference
website: https://github.com/cheaper-inference/OmniRoute
submitter: Watchers
submission: https://github.com/cheaper-inference/OmniRoute
repo: https://github.com/cheaper-inference/OmniRoute
support: https://github.com/cheaper-inference/OmniRoute/issues
gallery:
  - https://raw.githubusercontent.com/koko1111/watchersvault-store/master/watchersvault-omniroute/icon.svg
releaseNotes: >-
  The Tailscale auth key is read from the app data .env file. A key saved in
  Umbrel settings is moved there and removed from settings.yml. Leave that
  file blank to keep the Umbrel address only.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: OMNIROUTE_MEMORY_MB
    services:
      - server
    default: "4096"
    note: >-
      Node heap in megabytes. 1024 is enough for the dashboard. 4096 suits
      one coding client. Use 8192 or more for a heavy agent, and keep the
      Umbrel's free RAM above that heap.
  - name: NEXT_PUBLIC_BASE_URL
    services:
      - server
      - caddy
    default: ""
    note: >-
      Optional Tailscale HTTPS address, such as
      https://omniroute.your-tailnet.ts.net. Leave blank to use Umbrel only.
      Enable HTTPS and MagicDNS in the Tailscale admin console first.
  - name: AUTH_COOKIE_SECURE
    services:
      - server
    default: "false"
    options:
      - "false"
      - "true"
    note: Set true when the public address is https. Leave false for the Umbrel HTTP address.
  - name: TS_HOSTNAME
    services:
      - ts
    default: omniroute
    note: >-
      Machine name of the OmniRoute tailnet node. The public address must use
      this name plus your tailnet DNS suffix.
