version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: watchersvault-omniroute_server_1
      APP_PORT: 20128
      # Dashboard stays behind Umbrel login. API clients use an OmniRoute key.
      PROXY_AUTH_WHITELIST: "/v1/*,/v1"

  setup:
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu

        app=/mnt/app
        envfile="$$app/.env"
        settings="$$app/settings.yml"
        override="$$app/docker-compose.umbrel-user-settings.yml"
        runtime=/mnt/tailscale/.env

        mkdir -p /mnt/data /mnt/redis /mnt/tailscale "$$app"
        chown -R 1000:1000 /mnt/data
        chown -R 999:1000 /mnt/redis

        (
        set -eu
        umask 077
        if [ ! -f "$$envfile" ]; then
          printf '%s\n' '# Optional Tailscale auth key. This file is not Umbrel settings.' 'TS_AUTHKEY=' > "$$envfile"
        fi

        unquote() {
          v=$$1
          case $$v in
            \'*\')
              v=$${v#\'}
              v=$${v%\'}
              printf '%s' "$$v" | sed "s/''/'/g"
              ;;
            \"*\")
              v=$${v#\"}
              v=$${v%\"}
              printf '%s' "$$v" | sed 's/\\"/"/g; s/\\\\/\\/g'
              ;;
            *)
              printf '%s' "$$v"
              ;;
          esac
        }

        read_env() {
          found=
          while IFS= read -r line || [ -n "$$line" ]; do
            line=$$(printf '%s' "$$line" | tr -d '\r')
            trim=$$line
            while :; do
              case $$trim in
                [[:space:]]*) trim=$${trim#?} ;;
                *) break ;;
              esac
            done
            case $$trim in
              TS_AUTHKEY=*)
                found=$$(unquote "$${trim#TS_AUTHKEY=}")
                ;;
            esac
          done < "$$1"
          printf '%s' "$$found"
        }

        # Drop TS_AUTHKEY list items from Umbrel's settings.yml. Print the first value.
        extract_settings() {
          section=
          item=
          extracted=
          removed=0
          out=$$(mktemp)
          : > "$$out"
          flush() {
            if [ -z "$$item" ]; then
              return
            fi
            name=$$(printf '%s\n' "$$item" | sed -n 's/^  - name: //p; s/^    name: //p' | head -n 1)
            value=$$(printf '%s\n' "$$item" | sed -n 's/^    value: //p' | head -n 1)
            case $$section in
              environment|customEnvironment)
                if [ "$$name" = "TS_AUTHKEY" ]; then
                  case $$value in
                    '|'|'>'|'|'*|'>'*)
                      printf '%s' "$$item" >> "$$out"
                      ;;
                    *)
                      if [ -z "$$extracted" ] && [ -n "$$value" ]; then
                        extracted=$$(unquote "$$value")
                      fi
                      removed=1
                      ;;
                  esac
                  item=
                  return
                fi
                ;;
            esac
            printf '%s' "$$item" >> "$$out"
            item=
          }
          while IFS= read -r line || [ -n "$$line" ]; do
            case $$line in
              [![:space:]#]*)
                flush
                key=$${line%%:*}
                case $$key in
                  environment|customEnvironment) section=$$key ;;
                  *) section= ;;
                esac
                printf '%s\n' "$$line" >> "$$out"
                ;;
              '  - '*)
                if [ -n "$$section" ]; then
                  flush
                  item="$$line
        "
                else
                  flush
                  printf '%s\n' "$$line" >> "$$out"
                fi
                ;;
              '    '*|'')
                if [ -n "$$item" ]; then
                  item="$$item$$line
        "
                else
                  printf '%s\n' "$$line" >> "$$out"
                fi
                ;;
              *)
                flush
                printf '%s\n' "$$line" >> "$$out"
                ;;
            esac
          done < "$$1"
          flush
          if [ "$$removed" -eq 1 ]; then
            cat "$$out" > "$$1"
            echo "Removed TS_AUTHKEY from Umbrel settings." >&2
          fi
          rm -f "$$out"
          printf '%s' "$$extracted"
        }

        current=$$(read_env "$$envfile")
        moved=
        if [ -f "$$settings" ]; then
          moved=$$(extract_settings "$$settings")
        fi

        if [ -f "$$override" ]; then
          override_key=$$(sed -n 's/^[[:space:]]*TS_AUTHKEY:[[:space:]]*//p' "$$override" | head -n 1)
          if [ -n "$$override_key" ]; then
            override_key=$$(unquote "$$override_key")
            if [ -z "$$moved" ]; then
              moved=$$override_key
            fi
            tmp=$$(mktemp)
            cleaned=$$(mktemp)
            sed '/^[[:space:]]*TS_AUTHKEY:[[:space:]]*/d' "$$override" > "$$tmp"
            drop_empty='
              function indent(s, i) {
                i = 1
                while (i <= length(s) && substr(s, i, 1) == " ") i++
                if (i > length(s)) return -1
                return i - 1
              }
              { line[NR] = $$0 }
              END {
                for (i = 1; i <= NR; i++) {
                  s = line[i]
                  if (substr(s, length(s), 1) == ":" && substr(s, 1, 1) != "#") {
                    ind = indent(s)
                    j = i + 1
                    while (j <= NR && indent(line[j]) < 0) j++
                    if (j <= NR && indent(line[j]) > ind) print s
                    continue
                  }
                  print s
                }
              }
            '
            awk "$$drop_empty" "$$tmp" > "$$cleaned"
            awk "$$drop_empty" "$$cleaned" > "$$tmp"
            cat "$$tmp" > "$$override"
            rm -f "$$tmp" "$$cleaned"
          fi
        fi

        if [ -n "$$moved" ] && [ -z "$$current" ]; then
          case $$moved in
            *[!A-Za-z0-9_-]*)
              esc=$$(printf '%s' "$$moved" | sed 's/\\/\\\\/g; s/"/\\"/g')
              line="TS_AUTHKEY=\"$$esc\""
              ;;
            *)
              line="TS_AUTHKEY=$$moved"
              ;;
          esac
          tmp=$$(mktemp)
          replaced=0
          while IFS= read -r row || [ -n "$$row" ]; do
            case $$row in
              TS_AUTHKEY=*|[[:space:]]*TS_AUTHKEY=*)
                printf '%s\n' "$$line"
                replaced=1
                ;;
              *)
                printf '%s\n' "$$row"
                ;;
            esac
          done < "$$envfile" > "$$tmp"
          if [ "$$replaced" -eq 0 ]; then
            printf '%s\n' "$$line" >> "$$tmp"
          fi
          cat "$$tmp" > "$$envfile"
          rm -f "$$tmp"
          echo "Stored the Tailscale auth key in .env."
        elif [ -n "$$moved" ]; then
          echo "Kept the existing .env auth key and removed the settings copy."
        fi

        owner=$$(stat -c '%u:%g' "$$app")
        chown "$$owner" "$$envfile"
        chmod 600 "$$envfile"
        cp "$$envfile" "$$runtime"
        chmod 600 "$$runtime"
        ) || echo "Tailscale auth key was left unchanged."
    volumes:
      - ${APP_DATA_DIR}/data:/mnt/data
      - ${APP_DATA_DIR}/redis:/mnt/redis
      - ${APP_DATA_DIR}:/mnt/app
      - ${APP_DATA_DIR}/tailscale:/mnt/tailscale

  redis:
    image: redis:8.6.5-alpine@sha256:cd218f4b106a332c5c992e38a9480bfb9d7e9f8f7b0ec9a0023bfa36d9a408f9
    restart: on-failure
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --dir
      - /data
      - --loglevel
      - warning
    volumes:
      - ${APP_DATA_DIR}/redis:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  server:
    image: diegosouzapw/omniroute:latest
    restart: on-failure
    stop_grace_period: 40s
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      PORT: "20128"
      REQUIRE_API_KEY: "true"
      OMNIROUTE_MEMORY_MB: "4096"
      # Internal address for scheduled jobs. The browser-facing origin is optional.
      BASE_URL: http://watchersvault-omniroute_server_1:20128
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Separate tailnet node used only when .env contains an auth key. It does not
  # replace the Umbrel Tailscale app, and it does not listen on the host's ports.
  ts:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    restart: on-failure
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
    volumes:
      - ${APP_DATA_DIR}/tailscale:/var/lib/tailscale
      - ts-run:/var/run/tailscale
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        auth=
        if [ -f /var/lib/tailscale/.env ]; then
          while IFS= read -r line || [ -n "$$line" ]; do
            trim=$$line
            while :; do
              case $$trim in
                [[:space:]]*) trim=$${trim#?} ;;
                *) break ;;
              esac
            done
            case $$trim in
              TS_AUTHKEY=*)
                auth=$${trim#TS_AUTHKEY=}
                case $$auth in
                  \"*\") auth=$${auth#\"}; auth=$${auth%\"} ;;
                  \'*\') auth=$${auth#\'}; auth=$${auth%\'} ;;
                esac
                ;;
            esac
          done < /var/lib/tailscale/.env
        fi
        unset TS_AUTHKEY
        if [ -n "$$auth" ]; then
          export TS_AUTHKEY="$$auth"
        fi
        unset auth
        if [ -z "$${TS_AUTHKEY:-}" ] && [ ! -s /var/lib/tailscale/tailscaled.state ]; then
          echo "Tailscale HTTPS is off."
          exec sleep infinity
        fi
        export TS_HOSTNAME="$${TS_HOSTNAME:-omniroute}"
        exec /usr/local/bin/containerboot

  # HTTPS for a *.ts.net name. Caddy asks the sidecar's Tailscale daemon for
  # the certificate. With no public URL, this process waits and binds nothing.
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: on-failure
    network_mode: service:ts
    depends_on:
      - ts
      - server
    volumes:
      - ts-run:/var/run/tailscale
      - ${APP_DATA_DIR}/caddy:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        raw="$$NEXT_PUBLIC_BASE_URL"
        host="$${raw#https://}"
        host="$${host#http://}"
        host="$${host%%/*}"
        if [ -z "$$host" ]; then
          echo "Public HTTPS is off."
          exec sleep infinity
        fi
        mkdir -p /etc/caddy
        printf '%s {\n\treverse_proxy watchersvault-omniroute_server_1:20128\n}\n' "$$host" > /etc/caddy/Caddyfile
        i=0
        while [ "$$i" -lt 30 ] && [ ! -S /var/run/tailscale/tailscaled.sock ]; do
          i=$$((i + 1))
          sleep 2
        done
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  ts-run:
